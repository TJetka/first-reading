[project]
name = "first-reading-audio"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "piper-tts==1.8.0",
    "lameenc==1.8.1",
    "miniaudio==1.61",
]

[dependency-groups]
dev = ["pytest==8.3.4", "ruff==0.14.3"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
